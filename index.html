<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Les Égyptiens – Le jeu du scribe</title>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--sand:#f7e9c6;--card:#fffaf0;--ink:#2b1d10;--lapis:#1f4fa3;--gold:#e5a526;--turq:#16a394;--red:#c8432b;--ok:#2e9e50;--line:#2b1d10;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sand:#1c2a4d;--card:#2a3a63;--ink:#fff4d6;--line:#0d1630}}
:root[data-theme="dark"]{--sand:#1c2a4d;--card:#2a3a63;--ink:#fff4d6;--line:#0d1630}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;font-family:Lexend,Verdana,sans-serif;color:var(--ink);background:var(--sand);
background-image:repeating-linear-gradient(90deg,transparent 0 38px,rgba(31,79,163,.07) 38px 40px),linear-gradient(var(--sand),var(--sand));min-height:100vh;font-size:18px;line-height:1.45}
.wrap{max-width:760px;margin:0 auto;padding:14px}
.band{height:14px;background:repeating-linear-gradient(90deg,var(--lapis) 0 28px,var(--gold) 28px 56px,var(--turq) 56px 84px,var(--red) 84px 112px);border-bottom:3px solid var(--line)}
.top{display:flex;align-items:center;gap:10px;margin:6px 0 12px}
.top b{font-weight:800;font-size:20px}
.bar{flex:1;display:flex;gap:4px}
.bar i{flex:1;height:14px;border:2px solid var(--line);border-radius:4px;background:var(--card)}
.bar i.d{background:var(--gold)}.bar i.c{background:var(--ink);opacity:.35}
.card{background:var(--card);border:3px solid var(--line);border-radius:20px;box-shadow:0 6px 0 var(--line);padding:18px}
h1{font-size:40px;line-height:1.1;margin:0 0 8px;font-weight:800;color:var(--lapis)}
.q{display:flex;gap:12px;align-items:flex-start;font-size:23px;font-weight:600;margin-bottom:14px}
.snd{flex:none;width:56px;height:56px;border-radius:50%;border:3px solid var(--line);background:var(--turq);box-shadow:0 4px 0 var(--line);cursor:pointer;display:grid;place-items:center}
.snd:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.snd svg{width:28px;height:28px;fill:#fff}
.snd.on{background:var(--gold)}
button{font:inherit;color:inherit}
.opt,.btn{border:3px solid var(--line);border-radius:16px;background:#fff;color:#2b1d10;font-weight:600;font-size:21px;padding:14px 16px;cursor:pointer;box-shadow:0 5px 0 var(--line);text-align:center}
.opt:active,.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.btn{background:var(--gold);font-weight:800;font-size:22px}
.opts{display:grid;gap:12px;grid-template-columns:1fr}
.opts.flags{grid-template-columns:repeat(3,1fr)}
.opt.good{background:#b9ecc5;border-color:var(--ok)}
.opt.bad{background:#ffd0c8;animation:sh .35s}
.opt.sel{background:#cfe0ff}
.opt:disabled{cursor:default}
@keyframes sh{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.pic{display:block;max-width:100%;max-height:300px;margin:0 auto 14px;border:3px solid var(--line);border-radius:14px}
.sent{font-size:26px;font-weight:600;margin:6px 0 16px;line-height:1.7}
.slot{display:inline-block;min-width:130px;border-bottom:4px dashed var(--lapis);text-align:center;color:var(--ok);font-weight:800}
.fb{margin-top:16px;padding:12px 14px;border-radius:14px;background:#d9f4df;border:3px solid var(--ok);color:#12351c;font-weight:600}
.fb.n{background:#ffe9c2;border-color:var(--gold);color:#3a2700}
.nx{display:block;margin:16px auto 0}
.stage{position:relative;display:inline-block;max-width:100%}
.stage img{display:block;max-width:100%;border:3px solid var(--line);border-radius:14px}
.stage.hs{display:block;max-width:300px;margin:0 auto 12px;cursor:pointer}
.stage svg{position:absolute;inset:0;width:100%;height:100%;cursor:pointer}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:12px 22px}
.mt .opt{display:flex;align-items:center;justify-content:center;min-height:84px;padding:8px}
.mt img{max-width:100%;max-height:100px;border-radius:8px}
.mt .em{font-size:44px;line-height:1}
.opt.done{background:#b9ecc5;border-color:var(--ok)}
.center{text-align:center}
.stars{font-size:54px;letter-spacing:6px}
.rank{font-size:26px;font-weight:800;color:var(--red)}
@media (max-width:520px){h1{font-size:32px}.q{font-size:20px}.opts.flags{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
:focus-visible{outline:4px solid var(--lapis);outline-offset:2px}
</style>
</head>
<body>
<div class="band"></div>
<div class="wrap">
<div class="top" id="top" hidden><b>𓂀</b><div class="bar" id="bar"></div></div>
<main id="app"></main>
</div>

const imgTag=s.img?`<img class="pic" src="${IM[s.img]}" alt="">`:"";
if(s.t=="pick"){h=head(s.q,s.q+". "+s.o.join(". ou "))+imgTag+`<div class="opts">${s.o.map((o,k)=>`<button class="opt" data-k="${k}">${o}</button>`).join("")}</div>`}
if(s.t=="fill"){h=head("Complète la phrase.",s.say+" "+s.o.join(". ou "))+imgTag+`<div class="sent">${s.s.replace("___",'<span class="slot" id="slot">&nbsp;</span>')}</div><div class="opts">${s.o.map((o,k)=>`<button class="opt" data-k="${k}">${o}</button>`).join("")}</div>`}
if(s.t=="flag"){h=head(s.q,s.q)+`<div class="opts flags">${s.o.map((c,k)=>`<button class="opt" data-k="${k}" aria-label="Drapeau ${k+1}">${flag(c)}</button>`).join("")}</div>`}
if(s.t=="map"){h=head(s.q,s.q)+`<div class="center"><div class="stage"><img src="${IM.map}" alt="Carte du monde"><svg viewBox="0 0 600 400" id="map"><rect x="0" y="0" width="600" height="400" fill="transparent"/></svg></div></div>`}
if(s.t=="hot"){h=head(s.q,s.q)+`<div class="stage hs" id="hs"><img src="${IM.sarco}" alt="Sarcophage du pharaon Toutânkhamon"><svg id="hv"></svg></div>`}
if(s.t=="match"){const L=s.p.map((p,k)=>[p[0],k]),R=s.p.map((p,k)=>[p[1],k]).reverse();
h=head(s.q,s.q)+`<div class="mt"><div style="display:grid;gap:12px">${L.map(p=>`<button class="opt" data-s="l" data-k="${p[1]}">${p[0]}</button>`).join("")}</div><div style="display:grid;gap:12px">${R.map(p=>`<button class="opt" data-s="r" data-k="${p[1]}">${p[0]}</button>`).join("")}</div></div>`}
app.innerHTML=`<div class="card">${h}<div id="fb"></div></div>`;
app.querySelectorAll(".snd").forEach(b=>b.onclick=()=>say(b.dataset.say,b));
wire(s)}
function win(msg){const f=$("#fb");f.innerHTML=`<div class="fb">✓ Bravo ! ${msg}</div><button class="btn nx" id="nx">${i==S.length-1?"Voir mon résultat":"Suivant"}</button>`;if(tries==0)score++;$("#nx").onclick=()=>{speechSynthesis.cancel();i++;i<S.length?show():end()};$("#nx").focus()}
function lose(){tries++;$("#fb").innerHTML=`<div class="fb n">Essaie encore !</div>`}
function wire(s){
if(s.t=="pick"||s.t=="fill"||s.t=="flag"){app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const k=+b.dataset.k;if(k==s.a){b.classList.add("good");app.querySelectorAll(".opt").forEach(x=>x.disabled=true);if(s.t=="fill")$("#slot").textContent=s.o[k];win(s.ok)}else{b.classList.remove("bad");void b.offsetWidth;b.classList.add("bad");lose()}})}
if(s.t=="map"){const sv=$("#map");sv.onclick=e=>{const r=sv.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*600,y=(e.clientY-r.top)/r.height*400,m=MAPR;
if(x>m.x-6&&x<m.x+m.w+6&&y>m.y-6&&y<m.y+m.h+6){sv.onclick=null;sv.innerHTML+=`<rect x="${m.x}" y="${m.y}" width="${m.w}" height="${m.h}" rx="14" fill="#ffd400" fill-opacity=".75" stroke="#2b1d10" stroke-width="3"/>`;win(s.ok)}else lose()}}
if(s.t=="hot"){const hs=$("#hs");hs.onclick=e=>{const r=hs.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*100,y=(e.clientY-r.top)/r.height*100;
let f=null;for(const n of["serpent","barbe","nemes"]){const z=Z[n];if(x>=z[0]&&x<=z[2]&&y>=z[1]&&y<=z[3]){f=n;break}}
if(f==s.z){hs.onclick=null;const z=Z[f];$("#hv").setAttribute("viewBox","0 0 100 100");$("#hv").setAttribute("preserveAspectRatio","none");$("#hv").innerHTML=`<rect x="${z[0]}" y="${z[1]}" width="${z[2]-z[0]}" height="${z[3]-z[1]}" rx="3" fill="#2e9e50" fill-opacity=".3" stroke="#2e9e50" stroke-width="1.2"/>`;win(s.ok)}else lose()}}
if(s.t=="match"){let a=null,n=0;app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(b.classList.contains("done"))return;
if(!a||a.dataset.s==b.dataset.s){if(a)a.classList.remove("sel");a=b;b.classList.add("sel");return}
a.classList.remove("sel");if(a.dataset.k==b.dataset.k){a.classList.add("done");b.classList.add("done");a=null;if(++n==s.p.length)win(s.ok)}else{b.classList.remove("bad");void b.offsetWidth;b.classList.add("bad");a=null;lose()}})}}
function end(){$("#top").hidden=true;const p=score/S.length,st=p>.85?3:p>.6?2:1,rk=st==3?"Pharaon !":st==2?"Prêtre du temple":"Scribe en formation";
app.innerHTML=`<div class="card center"><div class="stars" aria-label="${st} étoiles sur 3">${"★".repeat(st)}<span style="opacity:.25">${"★".repeat(3-st)}</span></div><p class="rank">${rk}</p><h1 style="font-size:32px">${score} réussites du premier coup sur ${S.length}</h1><p>Tu as bien travaillé sur les Égyptiens.</p><button class="btn" id="re">Rejouer</button></div>`;$("#re").onclick=()=>{i=0;score=0;show()}}
start();
</script>
</body>
</html>
